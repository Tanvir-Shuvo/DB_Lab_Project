{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Delete Batch | SmartPoultry</title>

    <link rel="stylesheet" href="{% static 'css/batch.css' %}">

</head>

<body>

    <div class="delete-page">

        <div class="delete-card">

            <div class="delete-icon">
                ⚠️
            </div>

            <h1>Delete Batch?</h1>

            <p class="delete-warning">
                Are you sure you want to delete this batch?
                This action cannot be undone.
            </p>

            <div class="batch-info">

                <div class="info-row">
                    <span class="label">Batch Code</span>
                    <span class="value">{{ batch.code }}</span>
                </div>

                <div class="info-row">
                    <span class="label">Farm</span>
                    <span class="value">{{ batch.farm_name }}</span>
                </div>

                <div class="info-row">
                    <span class="label">Poultry Type</span>
                    <span class="value">{{ batch.poultry_type }}</span>
                </div>

            </div>

            <form method="post">

                {% csrf_token %}

                <div class="action-buttons">

                    <a href="{% url 'batch_list' %}" class="cancel-btn">
                        Cancel
                    </a>

                    <button type="submit" class="delete-btn">
                        Delete Batch
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>

</html>
