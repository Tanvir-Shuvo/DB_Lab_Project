{% extends "base.html" %}
{% load static %}

{% block title %}Delete Farm{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/farm.css' %}">
{% endblock %}

{% block content %}

<div class="farm-delete-page">

    <div class="delete-confirm-card">

        <div class="delete-confirm-icon">
            !
        </div>

        <h1>Delete Farm?</h1>

        <p class="delete-confirm-farm">
            {{ farm.name }}
        </p>

        <p class="delete-confirm-description">
            Are you sure you want to delete this farm?
            This action cannot be undone.
        </p>

        <div class="delete-confirm-actions">

            <a href="{% url 'farm_list' %}" class="delete-cancel-btn">
                Cancel
            </a>

            <form method="post" action="{% url 'farm_delete' farm.id %}">
                {% csrf_token %}

                <button type="submit" class="delete-confirm-btn">
                    Delete Farm
                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
